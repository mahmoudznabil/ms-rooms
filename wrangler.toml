# Cloudflare Pages configuration.
#
# MS-ROOMS is a single Pages project: the Next.js static export is served as
# Pages assets, and the API runs as a Pages Function under functions/api/.
# There is no separate Worker.
#
# Deploy with:  npx wrangler pages deploy
#
# `name` is the Pages project name (not a Worker name). Pages requires it at the
# top level because its environments all target the same project. Note that
# Pages rejects the Worker-only `main` and `observability` fields — Pages has
# its own logging, enabled in the dashboard under the project settings.

name = "ms-rooms"
compatibility_date = "2026-09-07"
pages_build_output_dir = "./out"

# Production D1 database. All `wrangler d1 execute` runs must use --remote.
[[d1_databases]]
binding = "DB"
database_name = "audioroom-db"
database_id = "82d9964f-ac73-4d0a-8c62-8f4940a05b0d"
# Authoritative migration chain consumed by `npm run db:migrate`.
migrations_dir = "migrations"

# Chat attachments.
[[r2_buckets]]
binding = "CHAT_ATTACHMENTS"
bucket_name = "ms-rooms"

# ---------------------------------------------------------------------------
# Preview environment (ACTIVE — created 2026-10-16).
#
# Preview deployments bind to this environment, NOT to production.
# D1: audioroom-db-preview (366b9b76-…), migrated with 0001–0011.
# R2: ms-rooms-preview.
# Re-apply after adding migrations:
#   npx wrangler d1 migrations apply audioroom-db-preview --remote --env preview
# ---------------------------------------------------------------------------
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "audioroom-db-preview"
database_id = "366b9b76-4ac7-4d18-a567-efbf1a826673"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "CHAT_ATTACHMENTS"
bucket_name = "ms-rooms-preview"
