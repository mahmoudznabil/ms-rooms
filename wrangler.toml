name = "bestaudiobackend"
main = "workers/backend.ts"
compatibility_date = "2026-09-07"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Production D1 database on Cloudflare ONLY — no local D1.
# All `wrangler d1 execute` runs must use --remote against database_id below.
[[d1_databases]]
binding = "DB"
database_name = "best-audio-room"
database_id = "82d9964f-ac73-4d0a-8c62-8f4940a05b0d"

[[r2_buckets]]
binding = "CHAT_ATTACHMENTS"
bucket_name = "ms-rooms"

# Cloudflare Calls credentials (SFU) + Realtime TURN — set via `wrangler secret put`
#   CALLS_ACCOUNT_ID, CALLS_APP_ID, CALLS_API_TOKEN (SFU sessions/new)
#   TURN_KEY_ID, TURN_API_TOKEN (rtc.live.cloudflare.com ICE servers)
# Do NOT define them under [vars] — [vars] would shadow the secrets with
# literal strings. Worker reads them from env at runtime.

# Frontend: the Next.js static export in ./out is served from this same
# Worker (Cloudflare's recommended Workers Static Assets path), because this
# account is currently blocked from creating new Pages projects
# (API code 8000030). Asset requests (/, /room, /_next/*) serve static
# files; /api/* and other unmatched routes fall through to the Worker below.
[vars]
# reCAPTCHA v2 site key (public) — used for registration bot protection
# Secret key must be set via `wrangler secret put RECAPTCHA_SECRET_KEY` (never commit)
RECAPTCHA_SITE_KEY = "6LeJIbwtAAAAABfH5omBJh8H-AqwRN2l9XzmdprD"

pages_build_output_dir = "./out"
